[package]
name = "accu_book"
version = "1.0.0"
edition = "2021"
description = "Headless notebook (document, DAG, jobs, .accu persist) — Jupyter alternative without network kernels"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscarr64/accu_book"
readme = "README.md"
keywords = ["notebook", "document-model", "accumath"]
categories = ["data-structures"]

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
